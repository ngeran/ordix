# ============================================================
# Deploy Ordix to Cloudflare Workers on every push to main.
# ------------------------------------------------------------
# Requires repository secrets:
#   CLOUDFLARE_API_TOKEN   — token with Workers + D1 edit perms
#   CLOUDFLARE_ACCOUNT_ID  — your account id
# (Alternatively use Cloudflare Workers Builds with the repo —
#  see README "Continuous deployment".)
# ============================================================

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (OpenNext → Cloudflare Worker)
        run: npx opennextjs-cloudflare build

      - name: Deploy
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
